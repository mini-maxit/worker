name: Image vulnerability scan

on:
  push:
    paths: ['.github/workflows/image-scan.yaml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - runtime-cpp
          - runtime-python-3.12
          - runtime-python-3.11
          - runtime-python-3.10
          - worker
    steps:
      - name: Trivy scan ghcr.io/mini-maxit/${{ matrix.image }}:latest
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.62.1 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --exit-code 1 "ghcr.io/mini-maxit/${{ matrix.image }}:latest"
