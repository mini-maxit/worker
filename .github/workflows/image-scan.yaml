name: Image vulnerability scan

# Called by the publish workflows with the images they just pushed, including their weekly rebuilds.
on:
  workflow_call:
    inputs:
      images:
        description: JSON array of image references
        required: true
        type: string
  workflow_dispatch:
    inputs:
      images:
        description: JSON array of image references
        required: true
        type: string

permissions: {} # the scanned images are public

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Trivy scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm aquasec/trivy:0.62.1@sha256:fc10faf341a1d8fa8256c5ff1a6662ef74dd38b65034c8ce42346cf958a02d5d \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --exit-code 1 "$IMAGE"
