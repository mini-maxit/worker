name: Runtime Images

on:
  workflow_dispatch:
  push:
    branches: ['master']
    paths:
      - 'internal/runtimescript/run_tests.sh'
      - 'internal/stages/executor/*/Dockerfile'
      - '.github/workflows/runtime-images.yaml'
  schedule:
    - cron: '23 2 * * 1' # weekly rebuild picks up base-image and apt security fixes

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runtime folders
        run: |
          for folder in $(find internal/stages/executor -mindepth 1 -maxdepth 1 -type d); do
            cp internal/runtimescript/run_tests.sh "$folder/run_tests.sh"
          done

      - name: Build and push runtime images
        env:
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          # Must match runtimescript.ImageTag(): workers pull the tag for the script they were built with.
          SCRIPT_TAG="script-$(sha256sum internal/runtimescript/run_tests.sh | cut -c1-12)"

          # build <image name> <folder> [extra buildx args]
          build() {
            local image="${REGISTRY}/${IMAGE_NAMESPACE}/$1" folder="$2"
            shift 2
            # Only the default branch may move the tags workers pull. latest is for workers older than script tags.
            local tags=(--tag "$image:sha-${GITHUB_SHA::12}")
            if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
              tags=(--tag "$image:$SCRIPT_TAG" --tag "$image:latest")
            fi
            docker buildx build --push --platform linux/amd64,linux/arm64 "${tags[@]}" "$@" "$folder"
          }

          for folder in $(find internal/stages/executor -mindepth 1 -maxdepth 1 -type d); do
            folder_name=$(basename "$folder")

            # Special handling for Python - build multiple versions
            if [ "$folder_name" = "python" ]; then
              for version in 3.10 3.11 3.12; do
                build "runtime-$folder_name-$version" "$folder" --build-arg "PYTHON_VERSION=$version"
              done
            else
              build "runtime-$folder_name" "$folder"
            fi
          done
