name: pre-commit

on: push

jobs:
  run-linters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install dependency tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 | go install golang.org/x/tools/cmd/goimports@latest

      - name: Set up pre-commit Cache
        uses: pre-commit/action@v3.0.1
